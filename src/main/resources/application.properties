server.port=8080

# Defaults for non-local runs. Prefer application-local.properties (profile: local).
uhunter.google-api-key=${UHUNTER_GOOGLE_API_KEY:}
# Screenshot strategy: pagespeed (default) | phantomjs
uhunter.screenshot-provider=pagespeed
# Max time for one /runtests request's parallel checks (ISO-8601 or Spring format, e.g. 4m)
uhunter.validation-timeout=4m
# Reuse PageSpeed responses (url + device) this long; max entries bounds memory (responses embed screenshots)
uhunter.pagespeed-cache-ttl=5m
uhunter.pagespeed-cache-max-entries=16
uhunter.phantomjs-cloud-api-keys=
uhunter.pagespeed-api-url=https://www.googleapis.com/pagespeedonline/v5/runPagespeed
uhunter.phantomjs-cloud-api-url-template=http://PhantomJsCloud.com/api/browser/v2/%s/

# Progress logs for validation flow (set DEBUG for Vision/OCR detail)
logging.level.br.com.uhunter=INFO
