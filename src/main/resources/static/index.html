<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Usability Hunter</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1a1f2b;
        --muted: #5b6475;
        --line: #d7dde8;
        --bg: #f3f6fb;
        --accent: #0b6e4f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, #dce9ff 0%, transparent 40%),
          radial-gradient(circle at bottom right, #d8f3e8 0%, transparent 35%),
          var(--bg);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      main {
        width: min(720px, 100%);
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 2rem;
        box-shadow: 0 18px 50px rgba(26, 31, 43, 0.08);
      }
      h1 { margin: 0 0 0.4rem; font-size: 1.8rem; }
      p { color: var(--muted); line-height: 1.5; }
      code {
        display: block;
        margin-top: 1rem;
        padding: 0.9rem 1rem;
        background: #101826;
        color: #d7ffe8;
        border-radius: 10px;
        overflow-x: auto;
        font-size: 0.92rem;
      }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <h1>Usability Hunter</h1>
      <p>
        Automated usability checks for websites (logo placement, left navigation,
        Hick’s law, mobile-friendliness, and performance).
      </p>
      <p>Try the API:</p>
      <code>GET /uhunter/runtests?url=https://example.com</code>
      <p style="margin-top: 1.2rem;">
        <a href="/uhunter/runtests?url=https://www.wikipedia.org">Run a sample test</a>
      </p>
    </main>
  </body>
</html>
